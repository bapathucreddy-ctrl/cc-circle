apply plugin: 'com.android.application'
android {
 namespace 'com.cccircle.admin'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId 'com.cccircle.admin'; minSdk 24; targetSdk 36; versionCode 1; versionName '0.1.0' }
 signingConfigs {
  release {
   storeFile file(System.getenv('CCIRCLE_SIGNING_FILE') ?: 'missing-release-key')
   storePassword System.getenv('CCIRCLE_SIGNING_PASSWORD')
   keyAlias System.getenv('CCIRCLE_SIGNING_ALIAS')
   keyPassword System.getenv('CCIRCLE_SIGNING_PASSWORD')
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false } }
 sourceSets.main.assets.srcDirs = ['../../dist']
}
