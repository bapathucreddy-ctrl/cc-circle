project_id = "cc-circle"

[functions.portfolio]
verify_jwt = false # Authenticated explicitly with auth.getUser in the function.
[functions.portfolio-callback]
verify_jwt = false # Public OAuth callback protected by hashed, single-use state.

# Local development configuration; CLI function deployment does not change hosted Auth.
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/auth/callback", "http://127.0.0.1:8081/auth/callback", "http://localhost:8082/auth/callback", "http://127.0.0.1:8082/auth/callback", "cccircle://auth/callback", "cccircle-pro://auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
template = "Your code is {{ .Code }}"

# Local-only test accounts: no SMS provider or SMS delivery is used.
[auth.sms.test_otp]
"919000000001" = "123456"
"919000000002" = "654321"

[analytics]
enabled = false

[functions.cashfree-order]
verify_jwt = false

[functions.cashfree-verify]
verify_jwt = false

[functions.cashfree-webhook]
verify_jwt = false

[functions.cashfree-refunds]
verify_jwt = false

[functions.cashfree-beneficiary]
verify_jwt = false

[functions.cashfree-payouts]
verify_jwt = false

[functions.location-search]
verify_jwt = false

[functions.notification-dispatch]
verify_jwt = false
