function booking(){const p=personData(),pkg=packageData();const timing=state.bookingTiming||'now';return '<div class="booking-screen">'+head('Book '+labels[state.category].toLowerCase(),'profile')+bookingMap()+'<div class="booking-panel"><div class="panel-grip"></div><h2>Where do you need them?</h2><p class="muted small" style="margin:0">Confirm your service location and booking time.</p><form id="booking-form" onsubmit="submitBooking(event)"><div class="booking-location">'+icon('pin')+'<div><label for="venue">Service location</label><input id="venue" name="venue" value="'+escape(state.draft.venue||state.location)+'" aria-label="Service location" required></div></div><div class="booking-timing"><button type="button" class="pill '+(timing==='now'?'active':'')+'" '+(!p[5]?'disabled':'')+' onclick="setBookingTiming(\'now\')">Now</button><button type="button" class="pill '+(timing==='schedule'?'active':'')+'" onclick="setBookingTiming(\'schedule\')">'+icon('calendar').replace('<svg','<svg style="width:12px;height:12px;vertical-align:middle"')+' Schedule</button></div>'+(timing==='schedule'?'<div class="form-grid">'+field('Booking date','date','date',state.draft.date||todayLocal())+field('Start time','time','time',state.draft.time||'09:00')+'</div>':'<input type="hidden" name="date" value="'+todayLocal()+'"><input type="hidden" name="time" value="'+timeLocal()+'">')+'<div class="service-choice">'+prop(state.category)+'<div class="selection"><h3>'+pkg[0]+'</h3><p>'+pkg[1]+'</p><p>'+(timing==='now'?(state.category==='Editor'?'Ready to connect in ~'+serviceEta()+' min':'Estimated arrival · '+serviceEta()+'–'+(serviceEta()+5)+' min'):'Reserved for your selected time')+'</p></div><div class="service-price"><strong>'+money(pkg[2])+'</strong><div class="muted tiny">Travel included</div></div></div><div class="booking-person"><div class="portrait">'+portrait(state.person)+'</div><div><strong>'+p[0]+'</strong><div class="muted small">★ '+p[4]+' · '+p[3]+' km away · Verified</div></div><button class="text-btn" type="button" style="margin-left:auto" onclick="captureBooking();go(\'profile\')">Change service</button></div><button type="button" class="payment" onclick="bookingPaymentSheet()"><span>'+icon('wallet')+'Pay after acceptance</span><span>Payment info '+icon('chevron')+'</span></button><div class="form-field" style="margin-top:12px"><label for="notes">Instructions <span class="muted">(optional)</span></label><textarea name="notes" id="notes" style="min-height:55px;font-size:11px" placeholder="Occasion, number of people, or special requirements…">'+escape(state.draft.notes||'')+'</textarea></div><p class="booking-notice">Your exact venue is shared only after acceptance. Final availability is confirmed by the professional.</p></form></div></div>'}
function bookingPaymentSheet(){openSheet('Payment for your service','<p class="muted small">Your total is '+money(packageData()[2])+', including travel within the service area.</p><p class="muted small">No money is charged when you request a booking. The production app will collect payment after acceptance.</p><button class="secondary full" onclick="closeSheet()">Got it</button>')}
const bookingTimers=new Map();
function openTracking(id){const booking=state.bookings.find(b=>b.id===id);if(!booking||!['Requested','Confirmed'].includes(booking.status)){toast('This booking is no longer active');return}state.lastBooking=booking;state.category=booking.role;state.person=booking.person;state.bookingTiming=booking.timing;go(booking.status==='Requested'?'matching':'confirmed')}
function renderActiveBooking(){const container=document.getElementById('active-booking');if(!container)return;const booking=state.bookings.find(b=>['Requested','Confirmed'].includes(b.status));if(!booking||['matching','confirmed'].includes(state.screen)){container.innerHTML='';return}container.innerHTML='<div class="active-trip">'+icon('pin')+'<div class="trip-info"><strong>'+escape(booking.name)+'</strong><p>'+(booking.status==='Requested'?'Awaiting acceptance':booking.timing==='schedule'?'Scheduled · '+escape(booking.date):'Confirmed · estimated '+booking.eta+'–'+(booking.eta+5)+' min')+'</p></div><button class="secondary" onclick="openTracking(\''+booking.id+'\')">Track booking</button></div>'}
function submitBooking(event){event.preventDefault();const f=new FormData(event.target);const scheduled=state.bookingTiming==='schedule';if(scheduled&&new Date(f.get('date')+'T'+f.get('time'))<=new Date()){toast('Choose a future booking date and time');return}const p=personData(),pkg=packageData();state.draft=Object.fromEntries(f);const b={id:'CC'+String(Date.now()).slice(-6),role:state.category,person:state.person,name:p[0],service:pkg[0],price:pkg[2],...state.draft,timing:scheduled?'schedule':'now',eta:serviceEta(),status:'Requested'};state.bookings.unshift(b);state.lastBooking=b;go('matching');bookingTimers.set(b.id,setTimeout(()=>acceptDemoBooking(b.id),4500))}
function matching(){const b=state.lastBooking;if(!b)return emptyBooking();return head('Confirming your booking','bookings')+bookingMap()+'<div class="booking-panel"><div class="panel-grip"></div><h2>Connecting you with '+escape(b.name.split(' ')[0])+'.</h2><p class="muted small">Checking availability and sending your service details.</p><div class="matching-meter"><span></span></div><div class="tracking-stages"><i class="on"></i><i></i><i></i></div><div class="summary-row"><span>Your service</span><strong>'+escape(b.service)+'</strong></div><div class="summary-row"><span>Estimated total</span><strong>'+money(b.price)+'</strong></div><p class="booking-notice">Demo: acceptance is simulated in a few seconds.</p><button class="secondary full" onclick="cancelActiveBooking()">Cancel request</button></div>'}
function acceptDemoBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b||b.status!=='Requested')return;b.status='Confirmed';b.trackingStart=Date.now();b.demoOffset=0;bookingTimers.delete(id);renderActiveBooking();if(state.screen==='matching'&&state.lastBooking?.id===id)go('confirmed');else if(state.screen==='bookings')render()}
function cancelActiveBooking(){if(state.lastBooking){clearTimeout(bookingTimers.get(state.lastBooking.id));bookingTimers.delete(state.lastBooking.id);state.lastBooking.status='Cancelled';}go('bookings');toast('Request cancelled. No payment was taken.')}
function confirmed(){const b=state.lastBooking;if(!b)return emptyBooking();const scheduled=b.timing==='schedule';return head('Track your booking','bookings')+trackingMap(b)+'<div class="tracking-fixed"><h2 id="tracking-stage-title" class="tracking-stage-title">'+trackingTitle(b)+'</h2><div class="tracking-status-row"><strong id="tracking-eta">'+trackingEta(b)+'</strong><span class="tiny muted">'+(scheduled?escape(b.date):'Simulated ETA')+'</span></div><div class="route-progress"><span id="tracking-progress"></span></div></div><div class="booking-panel" style="margin-top:0;padding:16px;border-radius:16px"><div class="row"><span class="status-pill">CONFIRMED</span><span class="tiny muted">'+b.id+'</span></div><div class="booking-person"><div class="portrait">'+portrait(b.person)+'</div><div><strong>'+b.name+'</strong><div class="muted small">'+labels[b.role]+' · ★ '+definitions[b.role].people[b.person][4]+'</div></div></div><div class="summary-row"><span>Service</span><strong>'+b.service+'</strong></div><div class="summary-row"><span>Venue</span><strong>'+escape(b.venue)+'</strong></div><div class="summary-row"><span>Total</span><strong>'+money(b.price)+'</strong></div><div class="booking-actions"><button class="primary" onclick="startChat(\''+b.id+'\')">'+icon('chat')+'Message</button><button class="secondary" onclick="bookingDetails(\''+b.id+'\')">Details</button></div>'+(!scheduled&&b.role!=='Editor'?'<div class="demo-tools"><button id="pause-tracking" onclick="pauseTracking()">'+(b.demoPaused?'Resume':'Pause')+' simulation</button><button onclick="advanceTracking()">Next stage →</button></div>':'')+'<p class="booking-notice">Demo map and movement. No real GPS or professional location is displayed.</p><button class="text-btn full" onclick="go(\'bookings\')">My bookings →</button></div>'}
function emptyBooking(){return '<div class="empty neu">Your circle is ready.<br>Book a professional to see your next collaboration here.<button class="text-btn full" style="margin-top:15px" onclick="go(\'discover\')">Explore talent →</button></div>'}
function bookings(){const list=state.bookings.filter(b=>state.bookingTab==='Upcoming'?['Requested','Confirmed'].includes(b.status):b.status===state.bookingTab);return head('My bookings')+'<h1 class="title">Plans coming to life.</h1><div class="pill-row">'+['Upcoming','Completed','Cancelled'].map(t=>'<button class="pill '+(state.bookingTab===t?'active':'')+'" onclick="state.bookingTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div>'+(list.length?list.map(b=>'<article class="booking-card neu"><div class="row"><span class="status-pill">'+b.status+'</span><span class="tiny muted">'+b.id+'</span></div><h3>'+b.service+'</h3><p class="muted small" style="margin:0">'+b.name+' · '+labels[b.role]+'</p>'+(['Requested','Confirmed'].includes(b.status)?'<button class="primary full track-button" onclick="openTracking(\''+b.id+'\')">'+icon('pin')+' '+(b.status==='Requested'?'View request status':'Track booking')+'</button>':'')+'<div class="summary-row"><span>Date & time</span><strong>'+escape(b.date)+' · '+escape(b.time)+'</strong></div><div class="summary-row"><span>Total</span><strong>'+money(b.price)+'</strong></div><div class="actions"><button class="secondary" onclick="bookingDetails(\''+b.id+'\')">Details</button><button class="secondary" onclick="startChat(\''+b.id+'\')">'+icon('chat')+'Message</button></div></article>').join(''):emptyBooking())}
function bookingDetails(id){const b=state.bookings.find(x=>x.id===id);openSheet('Booking '+b.id,'<h3>'+b.service+'</h3><p class="muted small">'+b.name+' · '+b.status+'</p><div class="summary-row"><span>When</span><strong>'+escape(b.date)+' · '+escape(b.time)+'</strong></div><div class="summary-row"><span>Area</span><strong>'+escape(b.venue)+'</strong></div><div class="summary-row"><span>Amount</span><strong>'+money(b.price)+'</strong></div><p class="muted small">'+escape(b.notes||'No extra requirements added.')+'</p>'+(['Requested','Confirmed'].includes(b.status)?'<button class="primary full" style="margin-bottom:14px" onclick="openTracking(\''+id+'\')">Track booking</button><button class="secondary full" onclick="cancelBooking(\''+id+'\')">Cancel this request</button>':''))}
function cancelBooking(id){clearTimeout(bookingTimers.get(id));bookingTimers.delete(id);state.bookings.find(b=>b.id===id).status='Cancelled';closeSheet();render();toast('Booking request cancelled')}
function startChat(id){state.lastBooking=state.bookings.find(b=>b.id===id);go('chat')}
function chat(){return head('Message '+(state.lastBooking?state.lastBooking.name.split(' ')[0]:'your professional'),'bookings')+'<div class="trust" style="margin:0">'+icon('shield')+'Private in-app conversation. No phone number shared.</div><div class="chat-meta">Today</div>'+state.messages.map((m,i)=>'<div class="chat-bubble '+(i?'mine':'')+'">'+escape(m)+'</div>').join('')+'<form class="message-form" onsubmit="sendMessage(event)"><input name="message" aria-label="Message" placeholder="Type a message…" required maxlength="1000"><button class="primary" aria-label="Send message">'+icon('arrow')+'</button></form>'}
function sendMessage(e){e.preventDefault();const value=new FormData(e.target).get('message').trim();if(value){state.messages.push(value);render()}}
function request(){return head('Post a requirement')+'<div class="eyebrow">Build your creative circle</div><h1 class="title" style="margin-top:10px">A brief.<br>A great beginning.</h1><p class="muted small">Tell nearby professionals about your project.</p><form onsubmit="submitRequest(event)"><div class="form-field"><label for="request-role">Who do you need?</label><select id="request-role" name="role">'+roles.map(r=>'<option value="'+r+'" '+(state.category===r?'selected':'')+'>'+labels[r]+'</option>').join('')+'</select></div>'+field('Project title','title','text','')+field('Date','request-date','date','2026-11-14')+field('Location','request-location','text',state.location)+field('Budget (₹)','request-budget','number','10000')+'<div class="form-field"><label for="brief">Your requirements</label><textarea id="brief" name="brief" required placeholder="Share the scope, style and any special requirements…"></textarea></div><button class="primary full">Find matching professionals '+icon('arrow')+'</button></form>'}
function submitRequest(e){e.preventDefault();const f=new FormData(e.target);choose(f.get('role'));state.budget=Number(f.get('request-budget'));state.query='';render();toast('Requirement saved for this session. Showing matches within your budget.')}
function account(){return head('Your circle')+'<div class="stats neu" style="display:block;text-align:left;padding:22px"><div class="row"><div><h2 style="font-weight:500;margin:0">Welcome to CC Circle</h2><p class="muted small">Your collaborations, in one place.</p></div>'+icon('user').replace('<svg','<svg style="width:28px;height:28px"')+'</div></div>'+[['bookings','My bookings','calendar'],['saved','Saved professionals','heart'],['join','Join as a professional','user'],['dashboard','Professional dashboard','wallet']].map(x=>'<button class="account-link" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+icon(x[2])+'</button>').join('')+'<button class="account-link" onclick="locationSheet()"><span>My location</span>'+icon('pin')+'</button><div class="trust">'+icon('shield')+'Only work, service details and approximate distance are public.</div>'}
function saveTalent(){const key=state.category+':'+state.person;const pos=state.saved.indexOf(key);if(pos>=0)state.saved.splice(pos,1);else state.saved.push(key);toast(pos>=0?'Removed from saved professionals':'Professional saved to your circle')}
function saved(){return head('Saved professionals','account')+(state.saved.length?state.saved.map(key=>{const [r,i]=key.split(':');return card(r,Number(i))}).join(''):'<div class="empty neu">Your shortlist starts here.<br>Save a professional from their profile.<button class="text-btn full" onclick="go(\'discover\')">Find talent →</button></div>')}
const signupTitles=['Choose your craft.','Make it specific.','Set your terms.','Show your work.','Ready for your circle?'];
const signupSteps=['Profession & account','Skills & specifications','Rates & availability','Portfolio connections','Review your profile'];
function join(){return head('Professional signup','account')+'<div class="eyebrow">Step '+state.joinStep+' of 5</div><h1 class="title" style="margin-top:10px">'+signupTitles[state.joinStep-1]+'</h1><div class="progress">'+[1,2,3,4,5].map(n=>'<span class="'+(n<=state.joinStep?'on':'')+'"></span>').join('')+'</div><p class="signup-step-label">'+signupSteps[state.joinStep-1]+'</p>'+[joinOne,joinTwo,joinThree,joinFour,joinReview][state.joinStep-1]()}
function signupFooter(next,label){return '<p id="signup-error" class="signup-error" role="alert"></p><button class="primary full" type="submit">'+label+' '+icon('arrow')+'</button>'+(state.joinStep>1?'<button type="button" class="text-btn full signup-back" onclick="joinBack()">Back to '+signupSteps[state.joinStep-2].toLowerCase()+'</button>':'')}
function joinOne(){return '<p class="muted small">Select your main profession. We’ll tailor your profile and search filters to your work.</p>'+services(true)+'<form id="signup-form" style="margin-top:25px" onsubmit="joinNext(event,2)">'+field('Professional display name','display-name','text',state.join['display-name']||'')+'<p class="signup-helper">This name appears on your public work profile.</p>'+field('Email address · private','email','email',state.join.email||'')+field('Base city','city','text',state.join.city||'Bengaluru')+signupFooter(2,'Continue as '+labels[state.joinRole])+'</form>'}
function selectedRole(){return '<div class="signup-role neu">'+prop(state.joinRole)+'<div><strong>'+labels[state.joinRole]+'</strong><p>Specifications for your profession</p></div><button class="text-btn" style="margin-left:auto" onclick="saveJoinDraft();state.joinStep=1;render()">Change</button></div>'}
function specInputs(){return definitions[state.joinRole].specs.map(([label,type,options],i)=>{const name='spec-'+i;let input;if(type==='multi'){const values=Array.isArray(state.joinSpecs[name])?state.joinSpecs[name]:[];return '<fieldset><legend>'+label+' <span class="muted tiny">· select at least one</span></legend><div class="signup-options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o+'" '+(values.includes(o)?'checked':'')+'><span>'+o+'</span></label>').join('')+'</div></fieldset>'}else if(type==='select')input='<select id="'+name+'" name="'+name+'" required><option value="">Select '+label.toLowerCase()+'</option>'+options.map(o=>'<option '+(state.joinSpecs[name]===o?'selected':'')+'>'+o+'</option>').join('')+'</select>';else input='<input id="'+name+'" name="'+name+'" type="number" min="100" max="250" placeholder="e.g. 175" value="'+escape(state.joinSpecs[name]||'')+'" required>';return '<div class="form-field"><label for="'+name+'">'+label+'</label>'+input+'</div>'}).join('')}
function joinTwo(){return selectedRole()+'<form id="signup-form" class="signup-specs" onsubmit="joinNext(event,3)">'+specInputs()+'<div class="form-field"><label for="bio">Professional introduction</label><textarea name="bio" id="bio" minlength="20" maxlength="500" required placeholder="Your experience, style, and the projects you enjoy…">'+escape(state.join.bio||'')+'</textarea></div><p class="signup-helper">20–500 characters. Keep phone numbers and personal contact details out of your public bio.</p>'+signupFooter(3,'Continue to pricing')+'</form>'}
function selectField(label,name,options){return '<div class="form-field"><label for="'+name+'">'+label+'</label><select id="'+name+'" name="'+name+'" required><option value="">Select an option</option>'+options.map(o=>'<option value="'+o+'" '+(state.join[name]===o?'selected':'')+'>'+o+'</option>').join('')+'</select></div>'}
function joinThree(){return '<p class="muted small">Give clients a clear starting price and the times you can work.</p><form id="signup-form" onsubmit="joinNext(event,4)"><div class="signup-block neu"><h3>Your first service</h3>'+field('Service name','service-name','text',state.join['service-name']||definitions[state.joinRole].packages[0][0])+'<div class="form-field"><label for="starting-price">Starting price (₹)</label><input id="starting-price" name="starting-price" type="number" min="100" max="1000000" step="100" value="'+escape(state.join['starting-price']||'')+'" placeholder="e.g. 7500" required></div>'+selectField('Charge per','price-unit',['Hour','Day','Session','Project','Performance'])+'</div>'+selectField('Work location','work-mode',['At client venue','At my studio','Remote','On-site & remote'])+selectField('Travel radius','travel-radius',['5 km','10 km','15 km'])+'<div class="form-field"><label for="available-from">Available from</label><input type="date" id="available-from" name="available-from" min="'+new Date().toISOString().slice(0,10)+'" value="'+escape(state.join['available-from']||'')+'" required></div>'+selectField('Usual working hours','hours',['Morning · 6 AM – 12 PM','Afternoon · 12 PM – 6 PM','Evening · 6 PM – 11 PM','Flexible · confirm per booking'])+'<label class="toggle-label"><input type="checkbox" name="available-now" '+(state.join['available-now']?'checked':'')+'>Show me as available now</label>'+signupFooter(4,'Continue to portfolio')+'</form>'}
function joinFour(){return '<p class="muted small">Add at least one public work link. Only the portfolio items you approve will appear to clients.</p><form id="signup-form" onsubmit="joinNext(event,5)">'+field('Instagram portfolio','instagram','url',state.join.instagram||'',false)+field('YouTube showreel','youtube','url',state.join.youtube||'',false)+field('Behance portfolio','behance','url',state.join.behance||'',false)+field('Professional website','website','url',state.join.website||'',false)+'<label class="toggle-label"><input type="checkbox" name="consent" '+(state.join.consent?'checked':'')+' required>Allow my selected public work to appear in my portfolio.</label><div class="trust" style="margin-bottom:23px">'+icon('shield')+'Your email and exact address stay private. You will approve imported work before it is published.</div>'+signupFooter(5,'Review my profile')+'</form>'}
function reviewRow(label,value){return '<div class="summary-row"><span>'+label+'</span><strong>'+escape(value||'—')+'</strong></div>'}
function joinReview(){const j=state.join;return '<div class="signup-review neu"><div class="row"><div><h3>'+escape(j['display-name'])+'</h3><p class="muted small">'+labels[state.joinRole]+' · '+escape(j.city)+'</p></div>'+prop(state.joinRole).replace('class="prop"','class="prop" style="width:58px;height:58px"')+'</div><p class="muted small">'+escape(j.bio)+'</p>'+definitions[state.joinRole].specs.map((s,i)=>reviewRow(s[0],Array.isArray(state.joinSpecs['spec-'+i])?state.joinSpecs['spec-'+i].join(', '):state.joinSpecs['spec-'+i])).join('')+'</div><div class="signup-review neu"><div class="row"><h3>Services & availability</h3><button class="text-btn" onclick="state.joinStep=3;render()">Edit</button></div>'+reviewRow('Service',j['service-name'])+reviewRow('Starting charge',money(j['starting-price'])+' / '+j['price-unit'])+reviewRow('Work location',j['work-mode'])+reviewRow('Service area',j['travel-radius'])+reviewRow('Available from',j['available-from'])+reviewRow('Working hours',j.hours)+'</div><div class="signup-review neu"><div class="row"><h3>Portfolio</h3><button class="text-btn" onclick="state.joinStep=4;render()">Edit</button></div>'+['instagram','youtube','behance','website'].filter(k=>j[k]).map(k=>reviewRow(k.charAt(0).toUpperCase()+k.slice(1),'Work link added')).join('')+'</div><div class="trust" style="margin-bottom:20px">'+icon('shield')+'Public: work name, profession, skills and prices. Private: email, contact information and precise location.</div><button class="primary full" onclick="finishJoin()">Create professional profile '+icon('check')+'</button><button class="text-btn full signup-back" onclick="joinBack()">Back to portfolio</button>'}
function saveJoinDraft(){const form=document.getElementById('signup-form');if(!form)return;const f=new FormData(form);for(const [k,v] of f){if(k.startsWith('spec-'))state.joinSpecs[k]=v;else state.join[k]=typeof v==='string'?v.trim():v}if(state.joinStep===2)definitions[state.joinRole].specs.forEach((s,i)=>{if(s[1]==='multi')state.joinSpecs['spec-'+i]=f.getAll('spec-'+i)});if(state.joinStep===3)state.join['available-now']=f.has('available-now');if(state.joinStep===4)state.join.consent=f.has('consent')}
function pickJoin(role){saveJoinDraft();if(role!==state.joinRole){state.joinRole=role;state.joinSpecs={};delete state.join['service-name'];delete state.join['starting-price'];delete state.join['price-unit']}render()}
function joinBack(){saveJoinDraft();state.joinStep=Math.max(1,state.joinStep-1);render();document.getElementById('view').scrollTop=0}
function signupError(message){const el=document.getElementById('signup-error');el.textContent=message;el.scrollIntoView({block:'center'})}
function joinNext(e,next){e.preventDefault();saveJoinDraft();if(state.joinStep===1&&(!state.join['display-name']||!state.join.city)){signupError('Enter a work name and city.');return}if(state.joinStep===2){const missing=definitions[state.joinRole].specs.find((s,i)=>s[1]==='multi'&&!state.joinSpecs['spec-'+i]?.length);if(missing){signupError('Choose at least one option for '+missing[0].toLowerCase()+'.');return}if((state.join.bio||'').length<20){signupError('Add at least 20 characters about your work.');return}}if(state.joinStep===3&&state.join['available-from']<new Date().toISOString().slice(0,10)){signupError('Choose today or a future availability date.');return}if(state.joinStep===4){const keys=['instagram','youtube','behance','website'];if(!keys.some(k=>state.join[k])){signupError('Add at least one portfolio or professional website link.');return}for(const k of keys){if(!state.join[k])continue;let url;try{url=new URL(state.join[k])}catch{signupError('Add a valid '+k+' URL.');return}const host=url.hostname.toLowerCase();const validHosts={instagram:['instagram.com'],youtube:['youtube.com','youtu.be'],behance:['behance.net']};if(!['https:','http:'].includes(url.protocol)||(validHosts[k]&&!validHosts[k].some(h=>host===h||host.endsWith('.'+h)))){signupError('Use a valid '+k+' work link.');return}}}state.joinStep=next;render();document.getElementById('view').scrollTop=0}
function finishJoin(){state.joinCreated=true;state.availability=!!state.join['available-now'];go('dashboard');toast('Your professional profile is ready in this preview')}
