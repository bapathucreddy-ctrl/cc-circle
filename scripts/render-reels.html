// ═══════════════════════════════════════════════════════
//  DRAW: MacBook Laptop Frame
// ═══════════════════════════════════════════════════════
function drawMacBook(ctx, x, y, w, h) {
  const lid_h = h * 0.88;
  const base_h = h * 0.12;
  const bezel = 14;

  // Lid (screen part) — silver aluminum
  const lidGrad = ctx.createLinearGradient(x, y, x, y + lid_h);
  lidGrad.addColorStop(0, '#d0d0d8');
  lidGrad.addColorStop(0.5, '#c8c8d0');
  lidGrad.addColorStop(1, '#b8b8c0');
  ctx.fillStyle = lidGrad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, lid_h, [14, 14, 4, 4]);
  ctx.fill();

  // Screen black border
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.roundRect(x + bezel, y + bezel, w - bezel*2, lid_h - bezel*1.5, [6,6,2,2]);
  ctx.fill();

  // Screen area (returned as coords for content)
  const sx = x + bezel + 2, sy = y + bezel + 2;
  const sw = w - bezel*2 - 4, sh = lid_h - bezel*1.5 - 4;

  // Camera dot
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(x + w/2, y + 9, 3, 0, Math.PI*2); ctx.fill();

  // Base (keyboard deck)
  const baseGrad = ctx.createLinearGradient(x, y + lid_h, x, y + lid_h + base_h);
  baseGrad.addColorStop(0, '#c0c0c8');
  baseGrad.addColorStop(1, '#a8a8b0');
  ctx.fillStyle = baseGrad;
  ctx.beginPath();
  ctx.roundRect(x, y + lid_h, w, base_h, [0, 0, 8, 8]);
  ctx.fill();

  // Keyboard hint
  ctx.fillStyle = 'rgba(80,80,90,0.4)';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 12; c++) {
      const kx = x + 16 + c * ((w-32)/12);
      const ky = y + lid_h + 4 + r * 11;
      ctx.beginPath();
      ctx.roundRect(kx, ky, (w-32)/12 - 3, 8, 2);
      ctx.fill();
    }
  }

  // Trackpad
  ctx.fillStyle = 'rgba(80,80,90,0.25)';
  ctx.beginPath();
  ctx.roundRect(x + w/2 - 45, y + lid_h + base_h - 22, 90, 16, 4);
  ctx.fill();

  return { sx, sy, sw, sh };
}

// ═══════════════════════════════════════════════════════
//  DRAW: VS Code inside MacBook screen
// ═══════════════════════════════════════════════════════
function drawVSCode(ctx, sx, sy, sw, sh, campaign, charReveal) {
  const accent = campaign.accent;
  // Background
  ctx.fillStyle = '#1e1e2e';
  ctx.fillRect(sx, sy, sw, sh);

  // Title bar (macOS style)
  ctx.fillStyle = '#181825';
  ctx.fillRect(sx, sy, sw, 22);
  ['#ff5f57','#febc2e','#28c840'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(sx + 10 + i*16, sy + 11, 5, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#45475a';
  ctx.font = "10px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("CC Circle — Visual Studio Code", sx + sw/2, sy + 15);

  // Activity bar (left strip)
  ctx.fillStyle = '#181825';
  ctx.fillRect(sx, sy + 22, 28, sh - 22);
  ['⎇','🔍','📁','🔧','🧩'].forEach((icon, i) => {
    ctx.fillStyle = i === 0 ? accent : '#45475a';
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(icon, sx + 14, sy + 50 + i * 26);
  });

  // Side explorer panel
  const explorerW = 120;
  ctx.fillStyle = '#181825';
  ctx.fillRect(sx + 28, sy + 22, explorerW, sh - 22);
  ctx.fillStyle = '#cdd6f4';
  ctx.font = "bold 8px -apple-system, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("EXPLORER", sx + 32, sy + 38);
  // File tree
  const files = [
    { name: 'CC-CIRCLE', indent: 0, folder: true },
    { name: 'mobile/src', indent: 1, folder: true },
    { name: '  components', indent: 2, folder: true },
    { name: '  screens', indent: 2, folder: true },
    { name: '  lib', indent: 2, folder: true },
    { name: campaign.file, indent: 3, active: true },
    { name: 'payments.ts', indent: 3 },
    { name: 'BookingDetail.tsx', indent: 3 },
    { name: 'Marketplace.tsx', indent: 3 },
  ];
  files.forEach((f, i) => {
    if (f.active) {
      ctx.fillStyle = accent + '33';
      ctx.fillRect(sx + 28, sy + 46 + i * 14, explorerW, 14);
    }
    ctx.fillStyle = f.active ? accent : f.folder ? '#cdd6f4' : '#a6adc8';
    ctx.font = `${f.active ? 'bold' : 'normal'} 8px -apple-system, monospace`;
    ctx.fillText((f.folder ? '📁 ' : '  ') + f.name.trim(), sx + 34 + f.indent * 6, sy + 57 + i * 14);
  });

  // Tab bar
  const codeX = sx + 28 + explorerW;
  const codeW = sw - 28 - explorerW;
  ctx.fillStyle = '#181825';
  ctx.fillRect(codeX, sy + 22, codeW, 20);
  ctx.fillStyle = '#1e1e2e';
  ctx.fillRect(codeX, sy + 22, 140, 20);
  ctx.fillStyle = accent;
  ctx.fillRect(codeX, sy + 40, 140, 2);
  ctx.fillStyle = '#cdd6f4';
  ctx.font = "9px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText('  ' + campaign.file, codeX + 4, sy + 35);

  // Status bar
  ctx.fillStyle = '#313244';
  ctx.fillRect(codeX, sy + sh - 16, codeW, 16);
  ctx.fillStyle = accent;
  ctx.font = "8px monospace";
  ctx.fillText('  ⎇ circle-app-updates  ✓ TypeScript  ✓ 157 tests passing', codeX + 4, sy + sh - 5);

  // Code area
  const lh = 13; // line height
  const codeAreaY = sy + 42;
  const codeAreaH = sh - 42 - 16;
  ctx.fillStyle = '#1e1e2e';
  ctx.fillRect(codeX, codeAreaY, codeW, codeAreaH);

  // Line numbers gutter
  ctx.fillStyle = '#181825';
  ctx.fillRect(codeX, codeAreaY, 28, codeAreaH);

  // Render code lines with syntax highlight
  const totalChars = campaign.codeLines.join('\n').length;
  const revealed = Math.floor(charReveal * totalChars);
  let charsSeen = 0;
  const maxLines = Math.floor(codeAreaH / lh) - 1;

  for (let i = 0; i < Math.min(campaign.codeLines.length, maxLines); i++) {
    const line = campaign.codeLines[i];
    const lineStart = charsSeen;
    charsSeen += line.length + 1;
    if (lineStart > revealed) break;

    // Line number
    ctx.fillStyle = '#585b70';
    ctx.font = "8px 'Courier New', monospace";
    ctx.textAlign = "right";
    ctx.fillText(String(i + 1), codeX + 26, codeAreaY + i * lh + 10);
    ctx.textAlign = "left";

    // Active line highlight
    const isActiveLine = (lineStart <= revealed && charsSeen > revealed);
    if (isActiveLine) {
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(codeX + 28, codeAreaY + i * lh, codeW - 28, lh);
    }

    const visLine = line.slice(0, Math.max(0, revealed - lineStart));
    if (!visLine && i > 0) continue;

    // Syntax color
    let color = '#cdd6f4';
    const t = line.trim();
    if (t.startsWith('//')) color = '#6c7086';
    else if (/^(import|export|from|return|const|let|var|function|async|await|if|else|type|interface)\b/.test(t)) color = '#cba6f7';
    else if (/"[^"]*"|'[^']*'|`[^`]*`/.test(t)) color = '#a6e3a1';
    else if (/\b(useState|useEffect|useMemo|useCallback|useRef|useResource|useTheme|useForegroundRefresh|useNavigationHeading|useTrackingPoint)\b/.test(t)) color = '#89b4fa';
    else if (/^[A-Z]/.test(t)) color = '#89dceb';

    ctx.fillStyle = color;
    ctx.font = "9px 'Courier New', monospace";
    ctx.fillText(visLine, codeX + 30, codeAreaY + i * lh + 10);

    // Cursor
    if (isActiveLine) {
      const cx = codeX + 30 + ctx.measureText(visLine).width;
      if (Math.floor(Date.now() / 450) % 2 === 0) {
        ctx.fillStyle = accent;
        ctx.fillRect(cx, codeAreaY + i * lh + 1, 2, lh - 2);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
//  DRAW: iOS Simulator Window
// ═══════════════════════════════════════════════════════
function drawSimulatorWindow(ctx, x, y, w, h, campaign, t) {
  const accent = campaign.accent;
  // Simulator app window chrome
  ctx.fillStyle = '#2d2d2d';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, [10,10,10,10]); ctx.fill();

  // Window title bar
  const tbH = 26;
  const tbGrad = ctx.createLinearGradient(x, y, x, y + tbH);
  tbGrad.addColorStop(0, '#4a4a4a');
  tbGrad.addColorStop(1, '#3a3a3a');
  ctx.fillStyle = tbGrad;
  ctx.beginPath(); ctx.roundRect(x, y, w, tbH, [10,10,0,0]); ctx.fill();

  ['#ff5f57','#febc2e','#28c840'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x + 12 + i*18, y + 13, 5.5, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#c0c0c0';
  ctx.font = "bold 11px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Simulator — iPhone 16 Pro Max — iOS 18.2", x + w/2, y + 17);

  // Simulator toolbar
  const tbY = y + tbH;
  ctx.fillStyle = '#363636';
  ctx.fillRect(x, tbY, w, 28);
  ['📱','⬅️','➡️','🔄','📸'].forEach((icon, i) => {
    ctx.font = "12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(icon, x + 8 + i * 26, tbY + 18);
  });
  ctx.fillStyle = '#888';
  ctx.font = "10px -apple-system, sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("Zoom: 75%  •  cc.circle/customer", x + w - 8, tbY + 18);

  // Phone device inside simulator
  const devX = x + w/2 - (w-32)/2;
  const devY = y + tbH + 28 + 10;
  const devW = w - 32;
  const devH = h - tbH - 28 - 20;
  drawiPhoneDevice(ctx, devX, devY, devW, devH, campaign, t);
}

// ═══════════════════════════════════════════════════════
//  DRAW: iPhone device shell inside simulator
// ═══════════════════════════════════════════════════════
function drawiPhoneDevice(ctx, x, y, w, h, campaign, t) {
  const accent = campaign.accent;
  // Body — titanium style
  const bodyGrad = ctx.createLinearGradient(x, y, x+w, y+h);
  bodyGrad.addColorStop(0, '#2a2a2e');
  bodyGrad.addColorStop(1, '#1a1a1e');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.fill();
  ctx.strokeStyle = '#4a4a5a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.stroke();

  // Side buttons
  ctx.fillStyle = '#3a3a4a';
  ctx.fillRect(x - 3, y + 80, 3, 32); // vol
  ctx.fillRect(x - 3, y + 124, 3, 32);
  ctx.fillRect(x + w, y + 100, 3, 52); // power

  // Screen inset
  const sx = x + 7, sy = y + 8, sw = w - 14, sh = h - 16;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 22); ctx.fill();

  // Status bar
  ctx.fillStyle = '#111';
  ctx.fillRect(sx, sy, sw, 26);
  ctx.fillStyle = '#fff';
  ctx.font = "bold 9px -apple-system, sans-serif";
  ctx.textAlign = "left";
  const now = new Date();
  ctx.fillText(`${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`, sx + 10, sy + 17);
  ctx.textAlign = "right";
  ctx.fillStyle = '#fff';
  ctx.font = "8px -apple-system, sans-serif";
  ctx.fillText('●●●  ▶  100%', sx + sw - 8, sy + 17);

  // Dynamic island
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.roundRect(sx + sw/2 - 40, sy, 80, 20, [0,0,14,14]); ctx.fill();

  // App content
  const appY = sy + 26;
  const appH = sh - 26;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(sx, appY, sw, appH, [0,0,22,22]); ctx.clip();

  if (campaign.appScreen === 'map') drawAppMap(ctx, sx, appY, sw, appH, t, accent);
  else if (campaign.appScreen === 'booking') drawAppBooking(ctx, sx, appY, sw, appH, t, accent);
  else drawAppMarketplace(ctx, sx, appY, sw, appH, t, accent);

  ctx.restore();

  // Home indicator
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.roundRect(sx + sw/2 - 40, sy + sh - 8, 80, 4, 2); ctx.fill();
}

// ═══════════════════════════════════════════════════════
//  APP SCREENS
// ═══════════════════════════════════════════════════════
function drawAppMap(ctx, x, y, w, h, t, accent) {
  // Dark map background
  const mg = ctx.createLinearGradient(x, y, x, y+h);
  mg.addColorStop(0, '#0b1220'); mg.addColorStop(1, '#111b2e');
  ctx.fillStyle = mg; ctx.fillRect(x, y, w, h);

  // Grid streets
  ctx.strokeStyle = 'rgba(148,163,184,0.1)'; ctx.lineWidth = 0.8;
  for (let gx = x; gx < x+w; gx += 18) { ctx.beginPath(); ctx.moveTo(gx,y); ctx.lineTo(gx,y+h); ctx.stroke(); }
  for (let gy = y; gy < y+h; gy += 18) { ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x+w,gy); ctx.stroke(); }

  // City blocks
  [[0.05,0.05,0.3,0.12],[0.42,0.02,0.35,0.1],[0.72,0.08,0.22,0.1],[0.03,0.25,0.25,0.14],[0.58,0.2,0.38,0.16],[0.1,0.45,0.35,0.16],[0.52,0.44,0.28,0.14],[0.08,0.65,0.42,0.12],[0.58,0.62,0.32,0.16]].forEach(([bx,by,bw,bh])=>{
    ctx.fillStyle='rgba(20,32,50,0.9)'; ctx.fillRect(x+bx*w,y+by*h,bw*w,bh*h);
    ctx.strokeStyle='rgba(40,60,90,0.7)'; ctx.lineWidth=0.5; ctx.strokeRect(x+bx*w,y+by*h,bw*w,bh*h);
  });

  // Mapbox branding-style label
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='7px sans-serif';ctx.textAlign='left';
  ctx.fillText('© Mapbox © OpenStreetMap',x+4,y+h-4);

  // Route with animation
  const route = [[0.12,0.92],[0.18,0.78],[0.28,0.64],[0.35,0.52],[0.48,0.42],[0.55,0.32],[0.6,0.22],[0.66,0.15]];
  ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.setLineDash([6,3]); ctx.lineDashOffset = -(t % 4) * 12;
  ctx.beginPath();
  route.forEach(([px,py],i)=>{ const rx=x+px*w,ry=y+py*h; i===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry); });
  ctx.stroke(); ctx.setLineDash([]);

  // Animated rider on route
  const prog = ((t*0.6) % 1);
  const ri = Math.min(Math.floor(prog*(route.length-1)),route.length-2);
  const rf = prog*(route.length-1)-ri;
  const rrx = x+(route[ri][0]+(route[ri+1][0]-route[ri][0])*rf)*w;
  const rry = y+(route[ri][1]+(route[ri+1][1]-route[ri][1])*rf)*h;
  const gr = ctx.createRadialGradient(rrx,rry,0,rrx,rry,16);
  gr.addColorStop(0,accent+'88');gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(rrx,rry,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=accent;ctx.beginPath();ctx.arc(rrx,rry,7,0,Math.PI*2);ctx.fill();
  ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('🛵',rrx,rry+4);

  // Pro pins
  [[0.3,0.45,'📸'],[0.55,0.55,'💄'],[0.4,0.3,'🎬']].forEach(([px,py,em])=>{
    const px2=x+px*w,py2=y+py*h;

    ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(em,px2,py2+4);
  });

  // Destination pin
  const dp=route[route.length-1]; const dpx=x+dp[0]*w,dpy=y+dp[1]*h;
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(dpx,dpy,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('📍',dpx,dpy+4);

  // ETA bottom sheet
  const bsH = Math.min(h * 0.28, 110);
  const bsY = y + h - bsH;
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.beginPath(); ctx.roundRect(x, bsY, w, bsH, [14,14,0,0]); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();ctx.roundRect(x+w/2-24,bsY+6,48,3,2);ctx.fill();
  ctx.fillStyle=accent;ctx.font='bold 11px -apple-system,sans-serif';ctx.textAlign='left';
  ctx.fillText('🛵  En Route · 4 min · 1.2 km',x+10,bsY+24);
  ctx.fillStyle='#94a3b8';ctx.font='9px -apple-system,sans-serif';
  ctx.fillText('Ravi Kumar (Photographer) is on the way',x+10,bsY+40);
  ctx.fillStyle='#1e293b';ctx.beginPath();ctx.roundRect(x+8,bsY+48,w/2-16,28,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 9px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('📞  Call Ravi',x+w/4,bsY+66);
  ctx.fillStyle=accent;ctx.beginPath();ctx.roundRect(x+w/2+8,bsY+48,w/2-16,28,8);ctx.fill();

}

// ═══════════════════════════════════════════════════════
//  DRAW FULL FRAME

function drawFrame(campaign, t) {
  const accent = campaign.accent;
  // Background
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0,0,W,H);
  // Subtle grid
  ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
  for(let gx=0;gx<W;gx+=60){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(let gy=0;gy<H;gy+=60){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

  // ── TOP HALF: MacBook + VS Code ──────────────────────
  const laptopMargin = 28;
  const laptopY = 155;
  const laptopW = W - laptopMargin*2;
  const laptopH = 540;
  const { sx, sy, sw, sh } = drawMacBook(ctx, laptopMargin, laptopY, laptopW, laptopH);
  const charReveal = Math.min(t / (DUR * 0.78), 1);
  drawVSCode(ctx, sx, sy, sw, sh, campaign, charReveal);

  // ── BOTTOM HALF: iOS Simulator ───────────────────────
  const simY = laptopY + laptopH + 26;
  const simH = H - simY - 270;
  const simW = Math.min(W - laptopMargin*2, simH * 0.72);
  const simX = W/2 - simW/2;
  drawSimulatorWindow(ctx, simX, simY, simW, simH, campaign, t);

  // ── DIVIDER LABEL ─────────────────────────────────────
  ctx.fillStyle = accent + '22';
  ctx.fillRect(0, laptopY - 2, W, 2);
  ctx.fillStyle = accent + '22';
  ctx.fillRect(0, simY - 14, W, 2);

  // ── TOP HOOK ─────────────────────────────────────────
  const hookAlpha = t < 0.8 ? t/0.8 : t > DUR-1 ? (DUR-t) : 1;
  ctx.fillStyle = `rgba(0,0,0,${0.8*hookAlpha})`;
  ctx.beginPath(); ctx.roundRect(24, 24, W-48, 116, 16); ctx.fill();
  ctx.strokeStyle = accent + '66'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(24, 24, W-48, 116, 16); ctx.stroke();

  // POV label
  ctx.fillStyle = accent;
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('POV:', 44, 60);
  ctx.fillStyle = `rgba(255,255,255,${hookAlpha})`;
  ctx.font = 'bold 22px -apple-system, sans-serif';

  // Word-wrap hook
  const words = campaign.hook.split(' ');
  let line1='', line2='';
  words.forEach(w => {
    if (ctx.measureText(line1 + w + ' ').width < W - 120) line1 += w + ' ';
    else line2 += w + ' ';
  });
  ctx.fillText(line1.trim(), 44, 88);
  if (line2) { ctx.font = 'bold 20px -apple-system, sans-serif'; ctx.fillText(line2.trim(), 44, 116); }

  // ── BOTTOM CAPTION ───────────────────────────────────
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.beginPath(); ctx.roundRect(24, H-258, W-48, 232, 18); ctx.fill();
  ctx.strokeStyle = accent + '44'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(24, H-258, W-48, 232, 18); ctx.stroke();

  // Progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.roundRect(44, H-246, W-88, 5, 3); ctx.fill();
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.roundRect(44, H-246, (W-88)*(t/DUR), 5, 3); ctx.fill();

  // Tech tag
  ctx.fillStyle = accent + 'cc';
  ctx.beginPath(); ctx.roundRect(44, H-234, 250, 24, 12); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.font = 'bold 11px -apple-system, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('⚡ ' + campaign.tag, 56, H-218);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px -apple-system, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('CC Circle — Creative Pro Marketplace', W/2, H-184);
  ctx.fillStyle = accent;
  ctx.font = '15px -apple-system, sans-serif';
  ctx.fillText("Bangalore's #1 platform for creative bookings", W/2, H-162);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '14px -apple-system, sans-serif';
  ctx.fillText('📱 Book photographers, makeup artists, videographers & more', W/2, H-138);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px -apple-system, sans-serif';
  ctx.fillText('🔗 Follow for launch updates  •  💬 DM us to join beta', W/2, H-112);
  ctx.fillStyle = accent;
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillText('#CCCircle #Bangalore #ReactNative #StartupIndia #CreativePro', W/2, H-88);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '11px monospace';
  ctx.fillText('Built with React Native · Expo · Mapbox · Supabase · Cashfree', W/2, H-64);
}

// ═══════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════
let startTime = null;
let currentCampaign = 0;

function renderFrame(ts) {
  if (!startTime) startTime = ts;
  const elapsed = (ts - startTime) / 1000;
  const t = elapsed % DUR;
  const campaign = campaigns[currentCampaign];
  ctx.clearRect(0,0,W,H);
  drawFrame(campaign, t);
  ST.textContent = `Campaign ${currentCampaign+1}/3: ${campaign.id}  |  ${t.toFixed(1)}s / ${DUR}s`;
  requestAnimationFrame(renderFrame);
}
requestAnimationFrame(renderFrame);

// ═══════════════════════════════════════════════════════
//  RECORDING API (called by Node.js generator)
// ═══════════════════════════════════════════════════════
window.startRecording = function(campaignIndex, durationMs) {
  return new Promise((resolve, reject) => {
    currentCampaign = campaignIndex;
    startTime = null;
    const stream = C.captureStream(FPS);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10_000_000 });
    const chunks = [];
    rec.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    };
    rec.onerror = reject;
    rec.start(200);
    setTimeout(() => rec.stop(), durationMs);
  });
};
